<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>My Chess</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Chess</h1>

    <div>
        <label>Light Squares:</label>
        <input type="color" id="lightColor" value="#f0d9b5">

        <label>Dark Squares:</label>
        <input type="color" id="darkColor" value="#b58863">
    </div>

    <div id="colorControls">
        <button id="whiteButton">♙ Play White</button>
        <button id="blackButton">♟ Play Black</button>
        <button id="randomButton">🎲 Random</button>
        <button onclick="flipBoard()">🔄 Flip Board</button>
    </div>
<div id="gameStatus"></div>

<div id="chessClock">
    <div class="clock black-clock" id="blackClock">10:00</div>
    <div class="clock white-clock" id="whiteClock">10:00</div>
</div>

    <div id="chessGameArea">

   <div id="timeControl">

    <div class="time-title">Time control</div>

    <div class="time-category">
        <button type="button" data-category="bullet">⚡ Bullet</button>
        <button type="button" data-category="blitz">🔥 Blitz</button>
        <button type="button" data-category="rapid">♟ Rapid</button>
        <button type="button" data-category="classical">🕐 Classical</button>
    </div>

    <select id="timeSelect">

        <option value="60,0">1 + 0</option>
        <option value="60,1">1 + 1</option>

        <option value="120,1">2 + 1</option>

        <option value="180,0">3 + 0</option>
        <option value="180,2">3 + 2</option>

        <option value="300,0">5 + 0</option>
        <option value="300,3">5 + 3</option>

        <option value="600,0" selected>10 + 0</option>
        <option value="600,5">10 + 5</option>

        <option value="900,10">15 + 10</option>

        <option value="1800,0">30 + 0</option>

    </select>

</div>

    <div id="moveHistory">
            <h3>Moves</h3>
            <div id="movesList"></div>
        </div>

        <div id="chessboard"></div>
<div id="capturedPieces">
    <div id="capturedWhite"></div>
    <div id="capturedBlack"></div>
</div>
<div id="openingTraining">
    <label for="openingSelect">♟️ Opening Training:</label>

    <select id="openingSelect">
        <option value="">Choose an opening</option>
        <option value="italian">Italian Game</option>
        <option value="sicilian">Sicilian Defense</option>
        <option value="najdorf">Sicilian Najdorf</option>
        <option value="spanish">Ruy Lopez</option>
        <option value="queensGambit">Queen's Gambit</option>
    </select>

    <button id="startOpening">Start Training</button>
</div>
<div id="pgnControls">

    <button id="copyPGN">📋 Copy PGN</button>
    <button id="downloadPGN">💾 Download PGN</button>
    <button id="shareGame">🔗 Share Game</button>

    <br>

    <input type="file" id="pgnFile" accept=".pgn">
    <button id="importPGN">📂 Import PGN</button>

    <div id="pgnNavigation">
        <button id="pgnFirst">⏮ First</button>
        <button id="pgnPrevious">◀ Previous</button>
        <span id="pgnMoveNumber">0 / 0</span>
        <button id="pgnNext">Next ▶</button>
        <button id="pgnLast">Last ⏭</button>
    </div>
    <div id="pgnAnalysis">
    <h3>🤖 Stockfish Analysis</h3>

    <div id="analysisEvaluation">
        Evaluation: 0.00
    </div>

    <div id="analysisBestMove">
        Best move: -
    </div>

    <div id="analysisDepth">
        Depth: -
    </div>

    <button id="analyzePosition">
        🔍 Analyze Position
    </button>
</div>

</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="./script.js?v=3"></script>

</body>

</html>
