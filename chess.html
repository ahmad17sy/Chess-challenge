<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>My Chess</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Chess</h1>

    <div>
        <label>Light Squares:</label>
        <input type="color" id="lightColor" value="#f0d9b5">

        <label>Dark Squares:</label>
        <input type="color" id="darkColor" value="#b58863">
    </div>

    <div id="colorControls">
        <button id="whiteButton">♙ Play White</button>
        <button id="blackButton">♟ Play Black</button>
    </div>
<div id="gameStatus"></div>

<div id="timeControl">
    <div class="time-title">Time control</div>

    <select id="timeSelect">
        <option value="60,0">1 + 0</option>
        <option value="60,1">1 + 1</option>
        <option value="120,1">2 + 1</option>
        <option value="180,0">3 + 0</option>
        <option value="180,2">3 + 2</option>
        <option value="300,0">5 + 0</option>
        <option value="300,3">5 + 3</option>
        <option value="600,0" selected>10 + 0</option>
        <option value="600,5">10 + 5</option>
        <option value="900,10">15 + 10</option>
        <option value="1800,0">30 + 0</option>
    </select>
</div>

<div id="chessClock">
    <div class="clock black-clock" id="blackClock">10:00</div>
    <div class="clock white-clock" id="whiteClock">10:00</div>
</div>

    <div id="chessGameArea">

    <div id="timeControl">
        <div class="time-title">Time control</div>

        <select id="timeSelect">
            <option value="60,0">1 + 0</option>
            <option value="60,1">1 + 1</option>
            <option value="120,1">2 + 1</option>
            <option value="180,0">3 + 0</option>
            <option value="180,2">3 + 2</option>
            <option value="300,0">5 + 0</option>
            <option value="300,3">5 + 3</option>
            <option value="600,0" selected>10 + 0</option>
            <option value="600,5">10 + 5</option>
            <option value="900,10">15 + 10</option>
            <option value="1800,0">30 + 0</option>
        </select>
    </div>

    <div id="moveHistory">
            <h3>Moves</h3>
            <div id="movesList"></div>
        </div>

        <div id="chessboard"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
