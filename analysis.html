<h1>Analysis Board</h1>

<div id="analysisPage">

    <div id="analysisBoardArea">

    <div id="analysisEvalBar">
        <div id="analysisEvalFill"></div>
    </div>

    <div id="analysisBoardColumn">

        <div id="analysisBoardWrapper">
    <div id="analysisChessboard"></div>
    <div id="analysisArrowLayer"></div>
    <div id="analysisManualArrowLayer"></div>
</div>
<div id="analysisBoardControls">
    <button id="analysisFlipBoard">↔ Flip Board</button>
</div>
        <div id="analysisNavigation">
            <button id="analysisFirst">⏮</button>
            <button id="analysisPrevious">◀</button>
            <button id="analysisNext">▶</button>
            <button id="analysisLast">⏭</button>
        </div>

    </div>

</div>

<div id="analysisPanel">

        <h2>Stockfish Analysis</h2>

        <div id="analysisEvaluation">
            Evaluation: 0.00
        </div>

        <div id="analysisDepth">
            Depth: 0
        </div>

        <div id="analysisBestMove">
            
            Best move: -
        </div>
        <div id="analysisTopMoves">
    <h3>Top 3 Moves</h3>

    <div id="analysisMove1">1. -</div>
    <div id="analysisMove2">2. -</div>
    <div id="analysisMove3">3. -</div>
</div>

        <div id="analysisMoves">
            <h3>Moves</h3>
            <div id="analysisMoveList"></div>
            
        </div>

    </div>

</div>
<script>
const analysisBoard =
    document.getElementById("analysisChessboard");

</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script src="./stockfish-18-lite-single.js"></script>
<script>
const analysisGame = new Chess();
let selectedAnalysisSquare = null;
let analysisMoves = [];

let analysisBoardFlipped = false;

let rightMouseDown = false;
let rightMouseStart = null;
let rightMouseMoved = false;
function refreshAnalysisBoard() {

    analysisBoard.innerHTML = "";

    const boardPosition =
        analysisGame.board();
        let displayRows = [0,1,2,3,4,5,6,7];
let displayCols = [0,1,2,3,4,5,6,7];

if (analysisBoardFlipped) {
    displayRows.reverse();
    displayCols.reverse();
}

    for (let row = 0; row < 8; row++) {

    for (let col = 0; col < 8; col++) {

        const boardRow =
            displayRows[row];

        const boardCol =
            displayCols[col];

            const square =
                document.createElement("div");

            square.classList.add("analysis-square");

            if ((row + col) % 2 === 0) {
                square.classList.add("analysis-light");
            } else {
                square.classList.add("analysis-dark");
            }

            const squareName =
    String.fromCharCode(97 + boardCol) +
    (8 - boardRow);
square.dataset.square = squareName;
            const piece =
    boardPosition[boardRow][boardCol];

            if (piece) {

                const color =
                    piece.color === "w" ? "w" : "b";

                const type =
                    piece.type.toUpperCase();

                const image =
                    document.createElement("img");

                image.src =
                    "./" + color + type + ".svg";

                image.classList.add(
                    "chess-piece"
                );

                image.alt = "";

                image.draggable = true;
image.style.pointerEvents = "auto";

image.addEventListener(
    "dragstart",
    function(event) {

        if (
            piece.color !==
            analysisGame.turn()
        ) {
            event.preventDefault();
            return;
        }

        selectedAnalysisSquare =
            squareName;

        event.dataTransfer.setData(
            "text/plain",
            squareName
        );

        event.dataTransfer.effectAllowed =
            "move";
    }
);

image.addEventListener(
    "dragend",
    function() {

        selectedAnalysisSquare = null;
    }
);

                square.appendChild(image);
            }

            /* =========================
               النقر
               ========================= */

            square.addEventListener(
                "click",
                function() {

                    const currentPiece =
                        analysisGame.get(squareName);

                    if (
                        selectedAnalysisSquare === null
                    ) {

                        if (!currentPiece) {
                            return;
                        }

                        if (
                            currentPiece.color !==
                            analysisGame.turn()
                        ) {
                            return;
                        }

                        selectedAnalysisSquare =
                            squareName;

                        return;
                    }

                    if (
                        selectedAnalysisSquare ===
                        squareName
                    ) {

                        selectedAnalysisSquare = null;

                        return;
                    }

                    makeAnalysisMove(
                        selectedAnalysisSquare,
                        squareName
                    );

                    selectedAnalysisSquare = null;
                }
            );

            /* =========================
               السحب والإفلات
               ========================= */

            square.addEventListener(
    "dragover",
    function(event) {

        event.preventDefault();

        event.dataTransfer.dropEffect =
            "move";
    }
);

            square.addEventListener(
    "drop",
    function(event) {

        event.preventDefault();

        const fromSquare =
            event.dataTransfer.getData(
                "text/plain"
            ) || selectedAnalysisSquare;

        if (!fromSquare) {
            return;
        }

        makeAnalysisMove(
            fromSquare,
            squareName
        );

        selectedAnalysisSquare = null;
    }
);

            analysisBoard.appendChild(square);
        }
    }
}
function makeAnalysisMove(from, to) {

    const move =
        analysisGame.move({
            from: from,
            to: to,
            promotion: "q"
        });

    if (!move) {
    refreshAnalysisBoard();
    return;
}

    /*
       إذا كنا قد رجعنا إلى نقلة سابقة،
       نحذف النقلات التي كانت بعدها.
    */
    if (analysisCurrentMove < analysisMoves.length) {

        analysisMoves =
            analysisMoves.slice(
                0,
                analysisCurrentMove
            );
    }

    analysisMoves.push(move.san);

    analysisCurrentMove =
        analysisMoves.length;

    updateAnalysisMoveList();

    refreshAnalysisBoard();

    analyzeCurrentPosition();
}

function updateAnalysisMoveList() {

    const moveList =
        document.getElementById(
            "analysisMoveList"
        );

    moveList.innerHTML = "";

    const history =
        analysisGame.history();

    for (let i = 0; i < analysisMoves.length; i++) {

        const moveNumber =
            Math.floor(i / 2) + 1;

        const moveButton =
            document.createElement("span");

        moveButton.classList.add(
            "analysis-move"
        );

        moveButton.textContent =
            analysisMoves[i];

        moveButton.style.cursor =
            "pointer";

        moveButton.addEventListener(
            "click",
            function() {

                showAnalysisMove(i + 1);

            }
        );

        if (i % 2 === 0) {

            const row =
                document.createElement("div");

            row.classList.add(
                "analysis-move-row"
            );

            const number =
                document.createElement("span");

            number.classList.add(
                "analysis-move-number"
            );

            number.textContent =
                moveNumber + ".";

            row.appendChild(number);

const whiteCell =
    document.createElement("span");

whiteCell.classList.add(
    "analysis-move-cell"
);

whiteCell.appendChild(moveButton);

row.appendChild(whiteCell);

            if (analysisMoves[i + 1]) {

                const blackMove =
                    document.createElement("span");

                blackMove.classList.add(
                    "analysis-move"
                );

                blackMove.textContent =
                    analysisMoves[i + 1];

                blackMove.style.cursor =
                    "pointer";

                blackMove.addEventListener(
                    "click",
                    function() {

                        showAnalysisMove(i + 2);

                    }
                );

                const blackCell =
    document.createElement("span");

blackCell.classList.add(
    "analysis-move-cell"
);

blackCell.appendChild(blackMove);

row.appendChild(
    blackCell
);
            }

            moveList.appendChild(row);
        }
    }
}
</script>
<script>

const analysisStockfish = new Worker(
    "./stockfish-18-lite-single.js"
);

let analysisStockfishReady = false;

analysisStockfish.onmessage = function(event) {

    const message = event.data;

    if (message === "uciok") {

        analysisStockfish.postMessage("isready");

        return;
    }

    if (message === "readyok") {

        analysisStockfishReady = true;

        analyzeCurrentPosition();

        return;
    }

    /* =========================
       Stockfish INFO
    ========================= */

    if (
        message.startsWith("info") &&
        message.includes("multipv") &&
        message.includes("score") &&
        message.includes("pv")
    ) {

        const multipvMatch =
            message.match(/multipv (\d+)/);

        const depthMatch =
            message.match(/depth (\d+)/);

        const scoreCpMatch =
            message.match(/score cp (-?\d+)/);

        const scoreMateMatch =
            message.match(/score mate (-?\d+)/);

        const pvMatch =
            message.match(/ pv (.+)$/);

        if (!multipvMatch || !pvMatch) {
            return;
        }

        const pvNumber =
            parseInt(
                multipvMatch[1],
                10
            );

        const firstMove =
            pvMatch[1].trim().split(" ")[0];

        if (!firstMove || firstMove.length < 4) {
            return;
        }

        /* =========================
           Convert Stockfish move to SAN
        ========================= */

        const from =
            firstMove.substring(0, 2);

        const to =
            firstMove.substring(2, 4);

        const promotion =
            firstMove.substring(4, 5);

        const tempGame =
            new Chess(
                analysisGame.fen()
            );

        const move =
            tempGame.move({
                from: from,
                to: to,
                promotion: promotion || "q"
            });

        let moveText = firstMove;

        if (move) {
            moveText = move.san;
        }

        /* =========================
           Evaluation
        ========================= */

        let scoreText = "";

        if (scoreCpMatch) {

            let score =
                parseInt(
                    scoreCpMatch[1],
                    10
                ) / 100;

            if (analysisGame.turn() === "b") {
                score = -score;
            }

            scoreText =
                (score >= 0 ? "+" : "") +
                score.toFixed(2);

            /*
               Evaluation bar and main evaluation
               only use the BEST line.
            */

            if (pvNumber === 1) {

                updateAnalysisEvalBar(score);

                document.getElementById(
                    "analysisEvaluation"
                ).textContent =
                    "Evaluation: " +
                    scoreText;
            }
        }

        if (scoreMateMatch) {

            const mate =
                parseInt(
                    scoreMateMatch[1],
                    10
                );

            scoreText =
                "Mate " +
                (mate > 0 ? "+" : "") +
                mate;

            if (pvNumber === 1) {

                document.getElementById(
                    "analysisEvaluation"
                ).textContent =
                    "Evaluation: Mate in " +
                    Math.abs(mate);
            }
        }

        /* =========================
           Depth
        ========================= */

        if (
            depthMatch &&
            pvNumber === 1
        ) {

            document.getElementById(
                "analysisDepth"
            ).textContent =
                "Depth: " +
                depthMatch[1];
        }

        /* =========================
           Top 3 Moves
        ========================= */

        const moveElement =
            document.getElementById(
                "analysisMove" + pvNumber
            );

        if (moveElement) {

            moveElement.textContent =
                pvNumber +
                ". " +
                moveText +
                (
                    scoreText
                        ? "    " + scoreText
                        : ""
                );
        }

        return;
    }

    /* =========================
       Best Move
    ========================= */

    if (message.startsWith("bestmove")) {

        const parts =
            message.split(" ");

        const bestMove =
            parts[1];

        if (
            bestMove &&
            bestMove !== "(none)"
        ) {

            const from =
                bestMove.substring(0, 2);

            const to =
                bestMove.substring(2, 4);

            const promotion =
                bestMove.substring(4, 5);

            const tempGame =
                new Chess(
                    analysisGame.fen()
                );

            const move =
                tempGame.move({
                    from: from,
                    to: to,
                    promotion:
                        promotion || "q"
                });

            if (move) {

                document.getElementById(
                    "analysisBestMove"
                ).textContent =
                    "Best move: " +
                    move.san;

            } else {

                document.getElementById(
                    "analysisBestMove"
                ).textContent =
                    "Best move: " +
                    bestMove;
            }

            drawAnalysisArrow(
                bestMove
            );
        }

            return;
}

function drawManualArrow(from, to) {

    const arrowLayer =
        document.getElementById("analysisManualArrowLayer");

    if (!arrowLayer) return;

    const existingArrow = arrowLayer.querySelector(
        '[data-from="' + from + '"][data-to="' + to + '"]'
    );

    if (existingArrow) {
        existingArrow.remove();
        return;
    }

    const rect =
        analysisBoard.getBoundingClientRect();

    const squareWidth =
        rect.width / 8;

    const squareHeight =
        rect.height / 8;

    let fromCol =
        from.charCodeAt(0) - 97;

    let fromRow =
        8 - parseInt(from[1]);

    let toCol =
        to.charCodeAt(0) - 97;

    let toRow =
        8 - parseInt(to[1]);

    if (analysisBoardFlipped) {

        fromCol = 7 - fromCol;
        fromRow = 7 - fromRow;

        toCol = 7 - toCol;
        toRow = 7 - toRow;
    }

    const x1 =
        fromCol * squareWidth +
        squareWidth / 2;

    const y1 =
        fromRow * squareHeight +
        squareHeight / 2;

    const x2 =
        toCol * squareWidth +
        squareWidth / 2;

    const y2 =
        toRow * squareHeight +
        squareHeight / 2;

    const dx = x2 - x1;
    const dy = y2 - y1;

    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const angle =
        Math.atan2(dy, dx) *
        180 / Math.PI;

    const arrow =
        document.createElement("div");

    arrow.className =
        "analysis-manual-arrow";

    arrow.dataset.from =
        from;

    arrow.dataset.to =
        to;

    arrow.style.width =
        length + "px";

    arrow.style.left =
        x1 + "px";

    arrow.style.top =
        y1 + "px";

    arrow.style.transform =
        "translateY(-50%) rotate(" +
        angle +
        "deg)";

    arrowLayer.appendChild(arrow);
}

function drawAnalysisArrow(move) {

    const arrowLayer =
        document.getElementById(
            "analysisArrowLayer"
        );

    if (!arrowLayer) return;

    arrowLayer.innerHTML = "";

    if (!move || move.length < 4) {
        return;
    }

    const from =
        move.substring(0, 2);

    const to =
        move.substring(2, 4);
let fromCol =
    from.charCodeAt(0) - 97;

let fromRow =
    8 - parseInt(from[1]);

let toCol =
    to.charCodeAt(0) - 97;

let toRow =
    8 - parseInt(to[1]);
    if (analysisBoardFlipped) {
    fromCol = 7 - fromCol;
    fromRow = 7 - fromRow;
    toCol = 7 - toCol;
    toRow = 7 - toRow;
}

    const squareSize =
        640 / 8;

    const x1 =
        fromCol * squareSize +
        squareSize / 2;

    const y1 =
        fromRow * squareSize +
        squareSize / 2;

    const x2 =
        toCol * squareSize +
        squareSize / 2;

    const y2 =
        toRow * squareSize +
        squareSize / 2;

    const dx = x2 - x1;
    const dy = y2 - y1;

    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const angle =
        Math.atan2(dy, dx) *
        180 / Math.PI;

    const arrow =
        document.createElement("div");

    arrow.className =
        "analysis-arrow";

    arrow.style.width =
        length + "px";

    arrow.style.left =
        x1 + "px";

    arrow.style.top =
        y1 + "px";

    arrow.style.transform =
        "rotate(" + angle + "deg)";

    arrowLayer.appendChild(arrow);
}

function analyzeCurrentPosition() {

    if (!analysisStockfishReady) {
        return;
    }

    const fen =
        analysisGame.fen();

    analysisStockfish.postMessage("stop");

    analysisStockfish.postMessage(
    "setoption name MultiPV value 3"
);

analysisStockfish.postMessage(
    "position fen " + fen
);

analysisStockfish.postMessage(
    "go depth 15"
);
}

analysisStockfish.postMessage("uci");

function updateAnalysisEvalBar(score) {

    const evalFill =
        document.getElementById(
            "analysisEvalFill"
        );

    if (!evalFill) return;

    let percentage =
        50 + (score * 10);

    percentage =
        Math.max(
            0,
            Math.min(
                100,
                percentage
            )
        );

    evalFill.style.height =
        percentage + "%";
}
let analysisCurrentMove = 0;

function showAnalysisMove(moveNumber) {

    const tempGame = new Chess();

    for (let i = 0; i < moveNumber; i++) {
        tempGame.move(analysisMoves[i]);
    }

    analysisGame.load(tempGame.fen());

    analysisCurrentMove = moveNumber;

    refreshAnalysisBoard();
    analyzeCurrentPosition();
}
document.getElementById("analysisFirst").addEventListener(
    "click",
    function() {
        showAnalysisMove(0);
    }
);

document.getElementById("analysisPrevious").addEventListener(
    "click",
    function() {

        if (analysisCurrentMove > 0) {
            showAnalysisMove(
                analysisCurrentMove - 1
            );
        }

    }
);

document.getElementById("analysisNext").addEventListener(
    "click",
    function() {

        if (
            analysisCurrentMove <
            analysisMoves.length
        ) {
            showAnalysisMove(
                analysisCurrentMove + 1
            );
        }

    }
);

document.getElementById("analysisLast").addEventListener(
    "click",
    function() {
        showAnalysisMove(
            analysisMoves.length
        );
    }
);
document.getElementById(
    "analysisFlipBoard"
).addEventListener(
    "click",
    function() {

        analysisBoardFlipped =
            !analysisBoardFlipped;

        refreshAnalysisBoard();
    }
);
/* =========================
   Mouse Wheel Navigation
   ========================= */

analysisBoard.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();

        if (event.deltaY < 0) {

            // Wheel UP → previous move
            if (analysisCurrentMove > 0) {

                showAnalysisMove(
                    analysisCurrentMove - 1
                );

            }

        } else {

            // Wheel DOWN → next move
            if (
                analysisCurrentMove <
                analysisMoves.length
            ) {

                showAnalysisMove(
                    analysisCurrentMove + 1
                );

            }

        }

    },
    {
        passive: false
    }
);
refreshAnalysisBoard();
</script>
